plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.diyboard.app'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.diyboard.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal sideload build: sign release with the debug key so `assembleRelease` installs too.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
